<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1480" viewBox="0 0 2000 1480" role="img" aria-labelledby="title desc">
<title id="title">BIA Platform Technical Roadmap</title><desc id="desc">Engineering dependency diagram for identity, Discord, service profile, events, ORBAT, log imports, maps, RBAC, salaries, and 3D awards.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#17221c"/><stop offset="1" stop-color="#101511"/></linearGradient><filter id="sh" x="-12%" y="-18%" width="125%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#050805" flood-opacity=".4"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a99b6b"/></marker><style>.ey{font:700 13px Arial;letter-spacing:2.5px;fill:#d5b85e}.ti{font:700 38px Arial;fill:#f2f2ec}.su{font:16px Arial;fill:#b9c3bb}.lane{fill:#151e18;stroke:#344237;stroke-width:1.5;rx:16}.lt{font:700 16px Arial;letter-spacing:1.5px;fill:#d9c16f}.ca{fill:#222d26;stroke:#516053;stroke-width:1.2;rx:12;filter:url(#sh)}.cb{fill:#202a24;stroke:#9a8450;stroke-width:1.4;rx:12;filter:url(#sh)}.nu{font:700 12px Arial;letter-spacing:1px;fill:#d8bd6c}.hd{font:700 17px Arial;fill:#f0f1eb}.bo{font:14px Arial;fill:#c0c9c1}.sm{font:13px Arial;fill:#aeb9b0}.co{fill:none;stroke:#9e915e;stroke-width:2.2;marker-end:url(#ar)}.da{fill:none;stroke:#82917f;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#ar)}</style></defs>
<rect width="2000" height="1480" fill="url(#bg)"/><text x="70" y="58" class="ey">BIA · ENGINEERING DEPENDENCIES</text><text x="70" y="108" class="ti">Technical roadmap and data flow</text><text x="70" y="142" class="su">Foundation first. Preserve source evidence separately from computed business decisions.</text>
<rect x="55" y="185" width="1890" height="205" class="lane"/><text x="80" y="217" class="lt">FOUNDATION · PHASE 0–1</text>
<rect x="55" y="405" width="1890" height="220" class="lane"/><text x="80" y="437" class="lt">IDENTITY, PERSONNEL AND DISCORD · PHASE 2–3</text>
<rect x="55" y="640" width="1890" height="245" class="lane"/><text x="80" y="672" class="lt">EVENTS, ORBAT AND ATTENDANCE PIPELINE · PHASE 4–6</text>
<rect x="55" y="900" width="1890" height="250" class="lane"/><text x="80" y="932" class="lt">ADVANCED OPERATIONS AND ADMINISTRATION · PHASE 7–9</text>
<rect x="55" y="1165" width="1890" height="235" class="lane"/><text x="80" y="1197" class="lt">PLAYER PRESENTATION · PHASE 10</text>
<g transform="translate(85 245)"><rect class="ca" width="380" height="115"/><text x="18" y="25" class="nu">0 · BASELINE</text><text x="18" y="53" class="hd">Inventory + delivery safety</text><text x="18" y="80" class="bo"><tspan x="18">Schema, data, hosting, backup/restore,</tspan><tspan x="18" dy="18">staging and rollback workflow</tspan></text></g>
<g transform="translate(515 245)"><rect class="cb" width="420" height="115"/><text x="18" y="25" class="nu">1 · IDENTITY + AUTHORIZATION</text><text x="18" y="53" class="hd">Steam User ↔ Player · RBAC · Audit</text><text x="18" y="80" class="bo"><tspan x="18">Server checks; default deny; audit</tspan><tspan x="18" dy="18">sensitive reads and mutations</tspan></text></g>
<g transform="translate(1000 245)"><rect class="ca" width="390" height="115"/><text x="18" y="25" class="nu">CROSS-CUTTING</text><text x="18" y="53" class="hd">Migrations and release gates</text><text x="18" y="80" class="bo"><tspan x="18">Schema change ≠ historical backfill;</tspan><tspan x="18" dy="18">fixtures, staging, recovery before release</tspan></text></g>
<g transform="translate(1450 245)"><rect class="ca" width="435" height="115"/><text x="18" y="25" class="nu">SHARED SERVICES</text><text x="18" y="53" class="hd">Storage · durable jobs · monitoring</text><text x="18" y="80" class="bo"><tspan x="18">External assets; bounded retries;</tspan><tspan x="18" dy="18">status/metrics without secret logging</tspan></text></g>
<path class="co" d="M465 300h45"/>
<g transform="translate(85 465)"><rect class="ca" width="420" height="125"/><text x="18" y="25" class="nu">2 · DISCORD</text><text x="18" y="53" class="hd">OAuth link + persistent bot</text><text x="18" y="80" class="bo"><tspan x="18">Role catalog keyed by role ID; classify</tspan><tspan x="18" dy="18">separately from player assignments</tspan></text></g>
<g transform="translate(555 465)"><rect class="ca" width="420" height="125"/><text x="18" y="25" class="nu">3 · PERSONNEL TAXONOMY</text><text x="18" y="53" class="hd">Rank · department · service · awards</text><text x="18" y="80" class="bo"><tspan x="18">Catalogs + dated assignments; award</tspan><tspan x="18" dy="18">grants retain issuer/date/revocation</tspan></text></g>
<g transform="translate(1025 465)"><rect class="ca" width="390" height="125"/><text x="18" y="25" class="nu">4 · PLAYER DASHBOARD</text><text x="18" y="53" class="hd">History + derived aggregates</text><text x="18" y="80" class="bo"><tspan x="18">Events, hours, service, rank, awards;</tspan><tspan x="18" dy="18">timezone/duration policy is explicit</tspan></text></g>
<g transform="translate(1465 465)"><rect class="ca" width="420" height="125"/><text x="18" y="25" class="nu">SYNC SAFETY</text><text x="18" y="53" class="hd">Reconcile and prevent echo loops</text><text x="18" y="80" class="bo"><tspan x="18">Event updates + periodic repair; handle</tspan><tspan x="18" dy="18">rate limits, deletion, permissions, retries</tspan></text></g>
<path class="co" d="M935 300V445H295V460"/><path class="co" d="M505 525h45"/><path class="co" d="M975 525h45"/><path class="da" d="M975 540h485"/>
<g transform="translate(85 705)"><rect class="ca" width="400" height="140"/><text x="18" y="25" class="nu">5 · PUBLIC CONTENT</text><text x="18" y="53" class="hd">Events · news · media</text><text x="18" y="82" class="bo"><tspan x="18">Public pages; object storage;</tspan><tspan x="18" dy="18">timezone/type and publish state</tspan></text></g>
<g transform="translate(535 705)"><rect class="ca" width="400" height="140"/><text x="18" y="25" class="nu">6 · EVENT AUTHORING</text><text x="18" y="53" class="hd">CRUD · validation · audit</text><text x="18" y="82" class="bo"><tspan x="18">Game, type, map, schedule, settings;</tspan><tspan x="18" dy="18">draft, preview, publish/archive</tspan></text></g>
<g transform="translate(985 705)"><rect class="ca" width="400" height="140"/><text x="18" y="25" class="nu">7 · ORBAT + SLOTS</text><text x="18" y="53" class="hd">Hierarchy + reservation history</text><text x="18" y="82" class="bo"><tspan x="18">Nodes/layout separate from slots;</tspan><tspan x="18" dy="18">safe assignment; accessible UI</tspan></text></g>
<g transform="translate(1435 705)"><rect class="cb" width="450" height="140"/><text x="18" y="25" class="nu">8–9 · LOG IMPORT + RECONCILE</text><text x="18" y="53" class="hd">Stage → dry run → authorized apply</text><text x="18" y="82" class="bo"><tspan x="18">Immutable evidence; idempotent batches;</tspan><tspan x="18" dy="18">attendance decision ≠ slot edit</tspan></text></g>
<path class="co" d="M485 775h45"/><path class="co" d="M935 775h45"/><path class="co" d="M1385 775h45"/>
<g transform="translate(85 970)"><rect class="ca" width="410" height="140"/><text x="18" y="25" class="nu">10–11 · MISSION MAP</text><text x="18" y="53" class="hd">SQM parse + plan versions</text><text x="18" y="82" class="bo"><tspan x="18">Versioned marker model; map calibration;</tspan><tspan x="18" dy="18">manual fallback; collaborative overlays</tspan></text></g>
<g transform="translate(555 970)"><rect class="ca" width="410" height="140"/><text x="18" y="25" class="nu">12 · RBAC</text><text x="18" y="53" class="hd">Resource/action permissions</text><text x="18" y="82" class="bo"><tspan x="18">Page, section, server action, record;</tspan><tspan x="18" dy="18">test direct access and ID substitution</tspan></text></g>
<g transform="translate(1025 970)"><rect class="ca" width="410" height="140"/><text x="18" y="25" class="nu">13 · SALARY LEDGER</text><text x="18" y="53" class="hd">Period rules + snapshots + payments</text><text x="18" y="82" class="bo"><tspan x="18">Inspect workbook; year/month unique;</tspan><tspan x="18" dy="18">base/override; formula version; scoped reads</tspan></text></g>
<g transform="translate(1495 970)"><rect class="ca" width="390" height="140"/><text x="18" y="25" class="nu">DATA SAFETY</text><text x="18" y="53" class="hd">Evidence + revisions</text><text x="18" y="82" class="bo"><tspan x="18">Fingerprints, diagnostics, resumable</tspan><tspan x="18" dy="18">backfills and correction path</tspan></text></g>
<path class="co" d="M1660 845V930H290V965"/><path class="co" d="M1185 845V955H760V965"/><path class="co" d="M1660 845V940H1230V965"/>
<g transform="translate(85 1240)"><rect class="cb" width="1800" height="110"/><text x="22" y="27" class="nu">14 · 3D PLAYER SERVICE VIEW</text><text x="22" y="57" class="hd">GLB soldier + Blender-authored anchors + declarative award-to-decoration mapping</text><text x="22" y="87" class="bo">PlayerAward selects approved ribbon/medal meshes; client viewer attaches by named anchors. Validate license, mobile budget, WebGL fallback and GPU cleanup.</text></g>
<path class="co" d="M1230 1110V1235"/><path class="co" d="M760 1110V1185H970V1235"/>
<text x="85" y="1390" class="sm">Decision gates: Discord role authority · ORBAT cardinality · attendance/slot policy · salary workbook · SQM/map support and rights · model redistribution rights</text><text x="85" y="1430" class="sm">Continuous: migrations → fixtures → staging → release/recovery; permission checks → audit; backup/restore; import/sync observability.</text></svg>
