<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
<title id="title">BIA Platform Roadmap — Client View</title><desc id="desc">Ten client-facing feature phases, from Steam sign-in through the 3D soldier service display.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#18221d"/><stop offset="1" stop-color="#101612"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#d8bd67"/><stop offset="1" stop-color="#8f7945"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#050806" flood-opacity=".45"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a79662"/></marker><style>.ey{font:700 14px Arial;letter-spacing:3px;fill:#d9bd68}.title{font:700 43px Arial;fill:#f0f0e9}.sub{font:18px Arial;fill:#bcc5bd}.card{fill:#202a24;stroke:#49564b;stroke-width:1.5;rx:14;filter:url(#shadow)}.n{font:700 15px Arial;fill:#151a15}.h{font:700 21px Arial;fill:#f1f1e9}.b{font:16px Arial;fill:#c7d0c7}.c{fill:none;stroke:#9d8c59;stroke-width:3;marker-end:url(#arrow)}.f{font:15px Arial;fill:#aeb8ad}</style></defs>
<rect width="1800" height="1120" fill="url(#bg)"/><path d="M70 905H1730" stroke="#28352b"/>
<text x="90" y="70" class="ey">BROTHERS IN ARMS · MEMBER AND OPERATIONS PLATFORM</text><text x="90" y="130" class="title">A clearer home for the whole BIA experience</text><text x="90" y="168" class="sub">A feature journey from member identity to events, operations and personal service.</text>
<path class="c" d="M405 340h42M765 340h42M1125 340h42M1485 340h42"/><path class="c" d="M1687 445v155h-110"/><path class="c" d="M1390 710h-42M1030 710h-42M670 710h-42M310 710h-42"/>
<g transform="translate(90 235)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">01</text><text x="67" y="45" class="h">Member access</text><text x="25" y="92" class="b"><tspan x="25">Sign in through Steam and</tspan><tspan x="25" dy="25">keep one service profile.</tspan></text></g>
<g transform="translate(450 235)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">02</text><text x="67" y="45" class="h">Discord connection</text><text x="25" y="92" class="b"><tspan x="25">Link accounts and sync</tspan><tspan x="25" dy="25">approved service roles.</tspan></text></g>
<g transform="translate(810 235)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">03</text><text x="67" y="45" class="h">Your service record</text><text x="25" y="92" class="b"><tspan x="25">See attendance, missions,</tspan><tspan x="25" dy="25">hours, medals and ribbons.</tspan></text></g>
<g transform="translate(1170 235)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">04</text><text x="67" y="45" class="h">Events and news</text><text x="25" y="92" class="b"><tspan x="25">Browse public events and</tspan><tspan x="25" dy="25">community updates.</tspan></text></g>
<g transform="translate(1530 235)"><rect class="card" width="200" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">05</text><text x="25" y="92" class="h"><tspan x="25">Event</tspan><tspan x="25" dy="26">planning</tspan></text><text x="25" y="160" class="b"><tspan x="25">Build squads</tspan><tspan x="25" dy="22">and slots.</tspan></text></g>
<g transform="translate(1390 600)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">06</text><text x="67" y="45" class="h">Attendance operations</text><text x="25" y="92" class="b"><tspan x="25">Import logs and reconcile</tspan><tspan x="25" dy="25">attendance and slots.</tspan></text></g>
<g transform="translate(1030 600)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">07</text><text x="67" y="45" class="h">Mission planning map</text><text x="25" y="92" class="b"><tspan x="25">Show mission markers and</tspan><tspan x="25" dy="25">share commander plans.</tspan></text></g>
<g transform="translate(670 600)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">08</text><text x="67" y="45" class="h">Permissions</text><text x="25" y="92" class="b"><tspan x="25">Give the right people access</tspan><tspan x="25" dy="25">to the right tools.</tspan></text></g>
<g transform="translate(310 600)"><rect class="card" width="315" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">09</text><text x="67" y="45" class="h">Salary records</text><text x="25" y="92" class="b"><tspan x="25">Review monthly earnings</tspan><tspan x="25" dy="25">and payment history.</tspan></text></g>
<g transform="translate(90 600)"><rect class="card" width="200" height="210"/><circle cx="35" cy="38" r="20" fill="url(#gold)"/><text x="35" y="43" text-anchor="middle" class="n">10</text><text x="25" y="92" class="h"><tspan x="25">3D service</tspan><tspan x="25" dy="26">display</tspan></text><text x="25" y="160" class="b"><tspan x="25">Wear earned</tspan><tspan x="25" dy="22">awards.</tspan></text></g>
<text x="90" y="970" class="ey">SHARED THROUGHOUT</text><text x="90" y="1008" class="f">Secure media storage · backups and recovery · change history · accessible design · privacy for members and salary records</text><text x="90" y="1060" class="f">Planning sequence only. Business rules and release timing will be agreed with BIA.</text></svg>
