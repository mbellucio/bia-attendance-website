services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - attendance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance} -d ${POSTGRES_DB:-attendance}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  discord-bot:
    build:
      context: ./discord-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./discord-bot/.env
    ports:
      - "127.0.0.1:${DISCORD_BOT_SYNC_PORT:-3100}:3100"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-attendance}
      DB_USER: ${POSTGRES_USER:-attendance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

volumes:
  attendance_postgres_data:
